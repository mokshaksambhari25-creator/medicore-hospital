services:
  - type: web
    name: medicore-hospital
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: MEDICORE_DB
        value: sqlite
      - key: MEDICORE_HTTPS
        value: "1"
      - key: MEDICORE_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.0"
