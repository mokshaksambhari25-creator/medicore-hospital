<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email &amp; SMS — MediCore</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body data-auth="staff" data-page="notifications.html">
  <div class="overlay" id="overlay"></div>
  <div id="pageTitle">Email &amp; SMS</div>
  <div id="pageSub">SMS, email and WhatsApp — demo queue unless Twilio / Gmail keys are set</div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <section class="kpi-row" id="kpis"></section>
        <div class="grid-2">
          <section class="card">
            <div class="card-head"><h2>Queue a message</h2></div>
            <p class="hint" id="mailHint">Gmail: add SERVER/smtp.env (see smtp.env.example). Until then messages are logged as demo.</p>
            <form id="sendForm">
              <div class="field"><label for="nChannel">Send as</label>
                <select id="nChannel">
                  <option value="EMAIL">Email (Gmail)</option>
                  <option value="SMS">SMS log</option>
                  <option value="WHATSAPP">WhatsApp log</option>
                </select>
              </div>
              <div class="field"><label for="nTo">To (email or phone)</label><input class="input" id="nTo" /></div>
              <div class="field"><label for="nTpl">Template</label>
                <select id="nTpl">
                  <option value="Appointment reminder">Appointment reminder</option>
                  <option value="Report ready">Report ready</option>
                  <option value="Payment due">Payment due</option>
                  <option value="Payment receipt">Payment receipt</option>
                  <option value="Scan slot changed">Scan slot changed</option>
                  <option value="Ward ready">Ward / bed ready</option>
                  <option value="Discharge summary">Discharge summary</option>
                  <option value="Pharmacy ready">Pharmacy ready</option>
                  <option value="Custom">Custom message</option>
                </select>
              </div>
              <div class="field"><label for="nBody">Message (edit or write your own)</label>
                <textarea id="nBody" class="input" rows="4"></textarea>
              </div>
              <button class="btn btn-primary" type="submit" style="width:100%" id="sendBtn">Send / log</button>
            </form>
          </section>
          <section class="card">
            <div class="toolbar">
              <input class="input" id="search" placeholder="Search recipient or template…" />
              <select id="fStatus"><option value="">All</option><option>Queued</option><option>Delivered</option><option>Failed</option></select>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>To</th><th>Template</th><th>Time</th><th>Date</th><th>Status</th><th></th></tr></thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <div id="toasts" class="toast-wrap"></div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
