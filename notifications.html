<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email &amp; SMS — MediCore</title>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/theme.css?v=mc32" />
</head>
<body data-auth="staff" data-page="notifications.html">
  <div class="overlay" id="overlay"></div>
  <div id="pageTitle">Email &amp; SMS</div>
  <div id="pageSub">Send a report or bill to a real inbox when Resend is configured</div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <section class="kpi-row" id="kpis"></section>
        <div class="grid-2">
          <section class="card">
            <div class="card-head"><h2>Send a message</h2></div>
            <p class="hint" id="mailStatus">Checking mail…</p>
            <form id="sendForm">
              <div class="field"><label for="nCh">Channel</label>
                <select id="nCh">
                  <option value="EMAIL">Email (Resend)</option>
                  <option value="SMS">SMS (MSG91 / Twilio)</option>
                  <option value="WHATSAPP">WhatsApp</option>
                </select>
              </div>
              <div class="field"><label for="nTo">To (Gmail for email)</label><input class="input" id="nTo" placeholder="patient@gmail.com" /></div>
              <div class="field"><label for="nTpl">Template</label>
                <select id="nTpl">
                  <option>Payment due</option>
                  <option>Report ready</option>
                  <option>Appointment reminder</option>
                  <option>Scan slot changed</option>
                  <option>Discharge summary</option>
                </select>
              </div>
              <div class="field"><label for="nBody">Message</label><textarea id="nBody" rows="4" placeholder="Leave blank to use the template name."></textarea></div>
              <button class="btn btn-primary" type="submit" style="width:100%" id="nSend">Send</button>
            </form>
          </section>
          <section class="card">
            <div class="toolbar">
              <input class="input" id="search" placeholder="Search recipient or template…" />
              <select id="fStatus"><option value="">All</option><option>Queued</option><option>Delivered</option><option>Failed</option></select>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>To</th><th>Template</th><th>Time</th><th>Date</th><th>Status</th><th></th></tr></thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <div id="toasts" class="toast-wrap"></div>
  <script src="js/data.js?v=mc32"></script>
  <script src="js/auth.js?v=mc32"></script>
  <script src="js/app.js?v=mc32"></script>
  <script src="js/i18n.js?v=mc32"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
