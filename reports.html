<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — MediCore</title>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body data-auth="staff" data-page="reports.html">
  <div class="overlay" id="overlay"></div>
  <div id="pageTitle">Reports</div>
  <div id="pageSub">Daily snapshot from live appointments, wards and billing</div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <section class="kpi-row" id="kpis"></section>
        <div class="pie-grid">
          <section class="card pie-card" id="pieDept"></section>
          <section class="card pie-card" id="pieBeds"></section>
        </div>
        <div class="grid-2">
          <section class="card">
            <div class="card-head"><h2>Patients by department</h2></div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Department</th><th>Total</th><th>Admitted</th></tr></thead>
                <tbody id="deptBody"></tbody>
              </table>
            </div>
          </section>
          <section class="card">
            <div class="card-head"><h2>Latest invoices</h2><a class="card-link" href="payment.html">Open billing</a></div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Invoice</th><th>Patient</th><th>Amount</th><th>Status</th></tr></thead>
                <tbody id="billBody"></tbody>
              </table>
            </div>
            <p class="hint" id="scanMeta"></p>
          </section>
        </div>
      </div>
    </div>
  </div>
  <div id="toasts" class="toast-wrap"></div>
  <script src="js/data.js?v=mc31"></script>
  <script src="js/auth.js?v=mc31"></script>
  <script src="js/app.js?v=mc31"></script>
  <script src="js/i18n.js?v=mc31"></script>
  <script src="js/charts.js?v=mc31"></script>
  <script src="js/reports.js?v=mc31"></script>
</body>
</html>
