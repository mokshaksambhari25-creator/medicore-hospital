<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient portal — Admin</title>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body data-auth="staff" data-page="admin-patients.html">
  <div class="overlay" id="overlay"></div>
  <div id="pageTitle">All patients</div>
  <div id="pageSub">Every portal login, report and bill — admin view</div>
  <div id="pageActions"><a class="btn btn-primary" href="patients.html">Register patient</a></div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <section class="kpi-row" id="kpis"></section>
        <section class="card">
          <div class="toolbar">
            <input class="input" id="search" placeholder="Search name or patient ID…" />
          </div>
          <div class="table-wrap desktop-table">
            <table>
              <thead><tr><th>Patient ID</th><th>Name</th><th>Dept</th><th>Status</th><th>Open bills</th><th>Reports</th><th></th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="cards-mobile" id="mobileList"></div>
        </section>
      </div>
    </div>
  </div>
  <div class="modal-back file-modal-back" id="fileModal">
    <div class="modal file-modal">
      <div class="file-hero">
        <div class="avatar-lg" id="fileAvatar">MC</div>
        <div class="file-hero-copy">
          <h3 id="detailTitle">Patient file</h3>
          <p class="file-sub" id="fileSub"></p>
          <div class="chip-row" id="fileChips"></div>
        </div>
        <button type="button" class="file-x" onclick="MC.closeModal('fileModal')" aria-label="Close">×</button>
      </div>
      <div class="file-grid">
        <section>
          <h4>Details</h4>
          <div id="detailMeta"></div>
        </section>
        <section>
          <h4>Reports</h4>
          <div class="table-wrap"><table>
            <thead><tr><th>Test</th><th>Slot</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="detailDx"></tbody>
          </table></div>
        </section>
        <section>
          <h4>Bills</h4>
          <div class="table-wrap"><table>
            <thead><tr><th>Invoice</th><th>Amount</th><th>Method</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="detailInv"></tbody>
          </table></div>
        </section>
        <section>
          <h4>Appointments</h4>
          <div class="table-wrap"><table>
            <thead><tr><th>When</th><th>Department</th><th>Status</th></tr></thead>
            <tbody id="detailAp"></tbody>
          </table></div>
        </section>
      </div>
    </div>
  </div>
  <div id="toasts" class="toast-wrap"></div>
  <script src="js/data.js?v=mc29"></script>
  <script src="js/auth.js?v=mc29"></script>
  <script src="js/app.js?v=mc29"></script>
  <script src="js/i18n.js?v=mc29"></script>
  <script src="js/admin-patients.js?v=mc29"></script>
</body>
</html>
