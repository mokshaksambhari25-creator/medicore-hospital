<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient portal — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body data-auth="staff" data-page="admin-patients.html">
  <div class="overlay" id="overlay"></div>
  <div id="pageTitle">All patients</div>
  <div id="pageSub">Every portal login, report and bill — admin view</div>
  <div id="pageActions"><a class="btn btn-primary" href="patients.html">Register patient</a></div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <section class="kpi-row" id="kpis"></section>
        <section class="card">
          <div class="toolbar">
            <input class="input" id="search" placeholder="Search name or patient ID…" />
          </div>
          <div class="table-wrap desktop-table">
            <table>
              <thead><tr><th>Patient ID</th><th>Name</th><th>Dept</th><th>Status</th><th>Open bills</th><th>Reports</th><th></th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="cards-mobile" id="mobileList"></div>
        </section>
        <section class="card" id="detailCard" style="margin-top:16px;display:none">
          <div class="card-head"><h2 id="detailTitle">Patient file</h2></div>
          <div class="patient-grid">
            <div id="detailMeta"></div>
            <div>
              <h2 style="font-size:16px;margin-bottom:10px">Reports</h2>
              <div class="table-wrap"><table><tbody id="detailDx"></tbody></table></div>
              <h2 style="font-size:16px;margin:16px 0 10px">Bills</h2>
              <div class="table-wrap"><table><tbody id="detailInv"></tbody></table></div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <div id="toasts" class="toast-wrap"></div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin-patients.js"></script>
</body>
</html>
