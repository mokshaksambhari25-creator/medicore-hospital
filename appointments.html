<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointments — MediCore</title>
  <!-- PAGE: Appointments | CSS: css/theme.css | JS: data + auth + app + appointments.js -->
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body data-auth="staff" data-page="appointments.html">
  <div class="overlay" id="overlay"></div>
  <div id="pageTitle">Appointments</div>
  <div id="pageSub">OPD booking and live queue — SMS row is logged on confirm</div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <section class="kpi-row" id="kpis"></section>
        <div class="grid-2">
          <section class="card">
            <div class="card-head"><h2>Book an OPD appointment</h2></div>
            <form id="bookForm">
              <div class="field" id="f-name"><label for="cName">Patient name</label><input class="input" id="cName" placeholder="Full name" /><div class="error">Name is required.</div></div>
              <div class="field" id="f-phone"><label for="cPhone">Mobile</label><input class="input" id="cPhone" placeholder="+91 …" /><div class="error">Phone is required.</div></div>
              <div class="field"><label for="cDept">Department</label>
                <select id="cDept">
                  <option>Cardiology</option><option>General Medicine</option><option>Orthopaedics</option>
                  <option>Neurology</option><option>Paediatrics</option><option>Oncology</option><option>Maternity</option>
                </select>
              </div>
              <div class="field"><label for="cDoctor">Doctor</label><select id="cDoctor"></select></div>
              <div class="field"><label for="cDate">Date</label><input class="input" id="cDate" type="date" /></div>
              <div class="field"><label>Time slot</label><div class="methods" id="slots" style="grid-template-columns:1fr 1fr 1fr"></div></div>
              <button class="btn btn-primary" type="submit" style="width:100%">Confirm booking</button>
            </form>
          </section>
          <section class="card">
            <div class="card-head"><h2>Queue</h2></div>
            <div class="toolbar">
              <input class="input" id="search" placeholder="Search patient or doctor…" />
              <select id="fStatus">
                <option value="">All</option>
                <option>Pending</option><option>Confirmed</option><option>Checked-in</option><option>Cancelled</option>
              </select>
            </div>
            <div class="table-wrap desktop-table">
              <table>
                <thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th></th></tr></thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
            <div class="cards-mobile" id="mobileList"></div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <div id="toasts" class="toast-wrap"></div>
  <script src="js/data.js?v=mc30"></script>
  <script src="js/auth.js?v=mc30"></script>
  <script src="js/app.js?v=mc30"></script>
  <script src="js/i18n.js?v=mc30"></script>
  <script src="js/appointments.js"></script>
</body>
</html>
