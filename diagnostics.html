<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnostics — MediCore</title>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body data-auth="staff" data-page="diagnostics.html">
  <div class="overlay" id="overlay"></div>
  <div id="pageTitle">Diagnostics</div>
  <div id="pageSub">MRI, CT and X-ray scheduling</div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <section class="kpi-row" id="kpis"></section>
        <div class="grid-2">
          <section class="card">
            <div class="card-head"><h2>Schedule a scan</h2></div>
            <form id="addForm">
              <div class="field"><label for="cPatient">Patient</label><input class="input" id="cPatient" list="pList" /><datalist id="pList"></datalist></div>
              <div class="field"><label for="cTest">Test</label>
                <select id="cTest"><option>MRI Brain</option><option>CT Chest</option><option>X-Ray</option><option>ECG</option><option>Ultrasound</option></select>
              </div>
              <div class="field"><label for="cDate">Date</label><input class="input" id="cDate" type="date" /></div>
              <div class="field"><label for="cSlot">Slot</label>
                <select id="cSlot"><option>09:00 AM</option><option>11:30 AM</option><option>02:00 PM</option><option>04:00 PM</option></select>
              </div>
              <button class="btn btn-primary" type="submit" style="width:100%">Book slot</button>
            </form>
          </section>
          <section class="card">
            <div class="toolbar">
              <input class="input" id="search" placeholder="Search patient or test…" />
              <select id="fStatus"><option value="">All</option><option>Scheduled</option><option>Done</option><option>Cancelled</option></select>
            </div>
            <div class="table-wrap desktop-table">
              <table>
                <thead><tr><th>ID</th><th>Patient</th><th>Test</th><th>Date</th><th>Slot</th><th>Status</th><th></th></tr></thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
            <div class="cards-mobile" id="mobileList"></div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <div id="toasts" class="toast-wrap"></div>
  <script src="js/data.js?v=mc27"></script>
  <script src="js/auth.js?v=mc27"></script>
  <script src="js/app.js?v=mc27"></script>
  <script src="js/i18n.js?v=mc27"></script>
  <script src="js/diagnostics.js"></script>
</body>
</html>
